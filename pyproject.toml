[project]
name = "activesite"
version = "0.1.0"
description = "ActiveSite: Autonomous QM/MM Assistant with Explainable Scientific Reasoning (Open Agent Hackathon 2026 - Track 02)"
authors = [{ name = "Khang Luong", email = "90603117@nebraska.edu" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "parmed>=4.3.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "duckdb>=1.1.0",
    "psycopg2-binary>=2.9.10",
    "python-multipart>=0.0.12",
    "openai>=3.37.0",
    "requests>=2.34.2",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
# temp dirs under the repo so Docker tests can mount them on Colima (it only shares $HOME)
addopts = "--basetemp=.pytest_tmp"
markers = [
    "slow: needs the Docker engine image or large reference files",
]

[tool.ruff]
# data/reference holds the team's original Amber/QM-MM scripts, kept byte-for-byte as delivered.
# force-exclude makes the pre-commit hook (which passes file names) respect this too.
extend-exclude = ["data/reference", ".claude"]
force-exclude = true
